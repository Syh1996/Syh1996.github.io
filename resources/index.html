<script>
(function() {
  let allPdfs = [];
  let categories = {};
  let currentCategory = 'all';

  // 加载 PDF 列表
  fetch('/pdf-list.json')
    .then(res => res.json())
    .then(data => {
      categories = data.categories;
      // 展平为数组
      Object.keys(categories).forEach(cat => {
        categories[cat].forEach(pdf => {
          allPdfs.push(pdf);
        });
      });
      renderTabs();
      renderList(allPdfs);
    })
    .catch(err => {
      document.getElementById('pdfList').innerHTML =
        '<p style="text-align:center;color:#999;padding:40px;">加载失败，请刷新重试</p>';
    });

  // 渲染分类标签
  function renderTabs() {
    const tabsEl = document.getElementById('categoryTabs');
    let html = '<span class="tab-item active" data-category="all">全部 (' + allPdfs.length + ')</span>';
    // 自定义分类排序
    const catOrder = Object.keys(categories).sort((a, b) => a.localeCompare(b, 'zh-CN'));
    catOrder.forEach(cat => {
      html += '<span class="tab-item" data-category="' + cat + '">' + cat + ' (' + categories[cat].length + ')</span>';
    });
    tabsEl.innerHTML = html;

    // 绑定点击事件
    tabsEl.querySelectorAll('.tab-item').forEach(tab => {
      tab.addEventListener('click', function() {
        tabsEl.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.dataset.category;
        filterAndRender();
      });
    });
  }

  // 过滤并渲染
  function filterAndRender() {
    const keyword = document.getElementById('pdfSearch').value.trim().toLowerCase();
    let filtered = allPdfs;
    if (currentCategory !== 'all') {
      filtered = filtered.filter(p => p.category === currentCategory);
    }
    if (keyword) {
      filtered = filtered.filter(p => p.name.toLowerCase().includes(keyword));
    }
    renderList(filtered);
  }

  // 渲染 PDF 列表
  function renderList(list) {
    const container = document.getElementById('pdfList');
    if (list.length === 0) {
      container.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">没有找到匹配的资料</p>';
      return;
    }

    let html = '';
    list.forEach((pdf, index) => {
      // 转义 HTML 属性中的特殊字符
      var safeName = pdf.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var safePath = pdf.path.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += '<div class="pdf-card" data-path="' + safePath + '" data-name="' + safeName + '" style="animation-delay:' + (index * 0.03) + 's">'
        + '<div class="pdf-card-icon">'
        + '<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="#e74c3c" opacity="0.1" stroke="#e74c3c" stroke-width="1.5"/><polyline points="14 2 14 8 20 8" stroke="#e74c3c" stroke-width="1.5" fill="none"/><text x="12" y="17" text-anchor="middle" fill="#e74c3c" font-size="5" font-weight="bold">PDF</text></svg>'
        + '</div>'
        + '<div class="pdf-card-info">'
        + '<h3 class="pdf-card-name" title="' + safeName + '">' + safeName + '</h3>'
        + '<div class="pdf-card-meta">'
        + '<span class="pdf-card-category">' + pdf.category + '</span>'
        + '<span class="pdf-card-size">' + pdf.sizeText + '</span>'
        + '</div>'
        + '</div>'
        + '<div class="pdf-card-action">'
        + '<span class="preview-btn">预览</span>'
        + '</div>'
        + '</div>';
    });
    container.innerHTML = html;

    // 绑定点击预览
    container.querySelectorAll('.pdf-card').forEach(card => {
      card.addEventListener('click', function() {
        const pdfPath = this.dataset.path;
        const pdfName = this.dataset.name;
        openPreview(pdfPath, pdfName);
      });
    });
  }

  // 搜索框事件
  document.getElementById('pdfSearch').addEventListener('input', function() {
    filterAndRender();
  });

  // 弹窗原始父节点引用（用于关闭时移回）
  var overlayOriginalParent = document.getElementById('pdfPreviewOverlay').parentNode;

  // 打开预览
  function openPreview(pdfPath, pdfName) {
    const overlay = document.getElementById('pdfPreviewOverlay');
    const iframe = document.getElementById('pdfIframe');
    const loading = document.getElementById('pdfLoading');
    const titleEl = document.getElementById('pdfPreviewTitle');
    const downloadBtn = document.getElementById('pdfDownloadBtn');

    titleEl.textContent = pdfName;
    downloadBtn.href = pdfPath;
    downloadBtn.download = pdfName + '.pdf';

    // 将弹窗移到 body 下，脱离 .main-content 的 max-width 限制
    document.body.appendChild(overlay);

    // 显示弹窗
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 显示加载状态
    loading.style.display = 'flex';
    iframe.style.display = 'none';

    // 检测是否为移动端
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    // 构建完整 URL（对中文路径进行编码）
    var fullUrl = location.origin + encodeURI(pdfPath);

    if (isMobile) {
      // 移动端：使用 Google Docs Viewer（支持在线渲染 PDF）
      iframe.src = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(fullUrl);
    } else {
      // PC 端：直接使用浏览器内置 PDF 查看器（Chrome/Edge/Firefox 效果最佳）
      // 添加 #toolbar=1&navpanes=1&scrollbar=1 参数优化显示
      iframe.src = encodeURI(pdfPath) + '#toolbar=1&navpanes=1&scrollbar=1&view=FitH';
    }

    iframe.onload = function() {
      loading.style.display = 'none';
      iframe.style.display = 'block';
    };

    // 超时处理：如果加载超时，隐藏 loading 直接显示 iframe
    setTimeout(function() {
      if (loading.style.display !== 'none') {
        loading.style.display = 'none';
        iframe.style.display = 'block';
      }
    }, 6000);
  }

  // 关闭预览
  function closePreview() {
    const overlay = document.getElementById('pdfPreviewOverlay');
    const iframe = document.getElementById('pdfIframe');
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    iframe.src = '';
    // 将弹窗移回原始位置
    if (overlayOriginalParent) {
      overlayOriginalParent.appendChild(overlay);
    }
  }

  document.getElementById('pdfCloseBtn').addEventListener('click', closePreview);
  document.getElementById('pdfPreviewOverlay').addEventListener('click', function(e) {
    if (e.target === this) closePreview();
  });

  // ESC 关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closePreview();
  });
})();

<script>
  (function () {
    const articleTitleList = document.querySelector('.article-title-list');
    const context = document.querySelector('.article-content.markdown-body');
    const mainContent = document.querySelector('.main-content');
    if (!articleTitleList || !context || !mainContent) return;

    const MIN_WIDTH = 140;
    const GAP = 12;
    const SCROLL_OFFSET = 70;
    // 默认宽度设为可用空间的最大值，首次 layout 时会计算
    var currentWidth = Infinity;

    const headings = Array.prototype.filter.call(
      context.querySelectorAll('h1, h2, h3, h4, h5, h6'),
      function (h) { return h.id && h.textContent.trim(); }
    );
    if (!headings.length) return;

    // 以文章中出现的最小标题级别作为第一级，最多展示 4 级
    const minLevel = Math.min.apply(null, headings.map(function (h) { return +h.tagName[1]; }));
    const listEl = articleTitleList.querySelector('.atl-list');
    const bodyEl = articleTitleList.querySelector('.atl-body');
    const links = [];

    headings.forEach(function (h) {
      const level = +h.tagName[1] - minLevel + 1;
      if (level > 4) return;
      const text = h.textContent.trim();
      const li = document.createElement('li');
      li.className = 'atl-item level-' + level;
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.title = text;
      a.textContent = text;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        const top = h.getBoundingClientRect().top + window.pageYOffset - SCROLL_OFFSET;
        window.scrollTo({ top: top, behavior: 'smooth' });
        history.replaceState(null, '', '#' + h.id);
      });
      li.appendChild(a);
      listEl.appendChild(li);
      links.push({ heading: h, li: li });
    });

    // 根据正文左侧剩余空间决定位置/宽度，空间不足则隐藏
    function getMaxWidth() {
      return Math.floor(mainContent.getBoundingClientRect().left - GAP * 2);
    }
    function layout() {
      var maxW = getMaxWidth();
      if (maxW < MIN_WIDTH) {
        articleTitleList.classList.remove('show');
        return;
      }
      // 保证当前宽度不超过可用空间
      currentWidth = Math.max(MIN_WIDTH, Math.min(currentWidth, maxW));
      articleTitleList.style.width = currentWidth + 'px';
      articleTitleList.style.left = GAP + 'px';
      articleTitleList.classList.add('show');
    }

    // ====== 拖拽调整宽度 ======
    var resizeHandle = articleTitleList.querySelector('.atl-resize-handle');
    if (resizeHandle) {
      var startX, startW;
      function onMouseMove(e) {
        e.preventDefault();
        var delta = e.clientX - startX;
        var maxW = getMaxWidth();
        currentWidth = Math.max(MIN_WIDTH, Math.min(startW + delta, maxW));
        articleTitleList.style.width = currentWidth + 'px';
      }
      function onMouseUp(e) {
        e.preventDefault();
        articleTitleList.classList.remove('resizing');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      resizeHandle.addEventListener('mousedown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        startX = e.clientX;
        startW = articleTitleList.offsetWidth;
        articleTitleList.classList.add('resizing');
        // 拖拽期间禁止全局文字选中，保持拖拽光标
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // 滚动时高亮当前所在标题，并让其保持在目录可视区域内
    let activeLi = null;
    function updateActive() {
      let current = links[0];
      for (let i = 0; i < links.length; i++) {
        if (links[i].heading.getBoundingClientRect().top - SCROLL_OFFSET - 10 <= 0) {
          current = links[i];
        } else {
          break;
        }
      }
      if (!current || current.li === activeLi) return;
      if (activeLi) activeLi.classList.remove('active');
      activeLi = current.li;
      activeLi.classList.add('active');

      const liTop = activeLi.offsetTop - listEl.offsetTop;
      if (liTop < bodyEl.scrollTop || liTop > bodyEl.scrollTop + bodyEl.clientHeight - activeLi.offsetHeight) {
        bodyEl.scrollTop = liTop - bodyEl.clientHeight / 2;
      }
    }

    let ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        updateActive();
        ticking = false;
      });
    });
    window.addEventListener('resize', layout);

    // 内容区宽度切换按钮会改变 main-content 的 max-width
    const expandBtn = document.querySelector('.tool-expand-width');
    if (expandBtn) {
      expandBtn.addEventListener('click', function () { setTimeout(layout, 50); });
    }

    layout();
    updateActive();
  })();

</script>
